<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark Irvin | Splash</title>
    <meta
      name="description"
      content="A modern and simple splash page with quick links to docs and app."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-glow" aria-hidden="true"></div>
    <main class="container">
      <header class="hero">
        <p class="eyebrow">markirvin.github.io</p>
        <h1>Welcome</h1>
        <p class="subtitle">
          A simple, polished launch point for reading docs and opening your app.
        </p>
      </header>

      <section class="grid" aria-label="Quick links">
        <a class="tile" href="docs.html" aria-label="Open documentation page">
          <h2>Documentation</h2>
          <p>Read notes, setup guides, and project docs in one place.</p>
          <span class="tile-action">Open docs</span>
        </a>

        <a class="tile" href="app.html" aria-label="Open app page">
          <h2>App</h2>
          <p>Launch your app area and jump into what you are building.</p>
          <span class="tile-action">Open app</span>
        </a>
      </section>
    </main>
  </body>
</html>
