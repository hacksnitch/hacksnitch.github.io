<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark Irvin | Splash</title>
    <meta
      name="description"
      content="A modern and simple splash page with quick links to docs and app."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-glow" aria-hidden="true"></div>
    <main class="container">
      <header class="hero">
        <p class="eyebrow"></p>
        <h1 class="hero-title">
          <img
            class="hero-logo"
            src="hacksnitch_logo_me_159KB.jpg"
            alt="Hacksnitch logo"
          />
          <span>M. Irvin </span>
        </h1>
        <p class="subtitle">
          A quick, simple way to get inside of my head and explore my work 
        </p>
      </header>

      <section class="grid" aria-label="Quick links">
        <a class="tile" href="docs.html" aria-label="Open documentation page">
          <h2>Docs and Papers</h2>
          <p>Agility, API, Architecture and Math Docs</p>
          <span class="tile-action"></span>
        </a>

        <a class="tile" href="app.html" aria-label="Open app page">
          <h2>Apps and Utilities</h2>
          <p>Launch your app area and jump into what you are building.</p>
          <span class="tile-action"></span>
        </a>
      </section>
    </main>
  </body>
</html>
